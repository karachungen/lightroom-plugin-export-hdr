name: Release Lightroom plugin (macOS + Windows)

on:
  workflow_dispatch:

concurrency:
  group: release-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-26
            artifact: ExportHDR.lrplugin-macos-arm64.zip
          - id: windows-x64
            runner: windows-latest
            artifact: ExportHDR.lrplugin-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Qt cache (macOS)
        if: matrix.id == 'macos-arm64'
        id: qt-cache-macos
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/qt-macos-arm64.tar.zst
          key: qt-macos-arm64-${{ hashFiles('scripts/qt/macos-arm64.stamp') }}

      - name: Restore Qt cache (Windows)
        if: matrix.id == 'windows-x64'
        id: qt-cache-windows
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/qt-windows-x64.tar.zst
          key: qt-windows-x64-${{ hashFiles('scripts/qt/windows-x64.stamp') }}

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build, test, and package plugin
        shell: bash
        env:
          UHDR_QT_CACHE_RESTORED: ${{ steps.qt-cache-macos.outputs.cache-hit || steps.qt-cache-windows.outputs.cache-hit || 'false' }}
        run: bash scripts/build_plugin.sh all

      - name: Stop sccache server
        shell: bash
        run: |
          export SCCACHE_DIR="$GITHUB_WORKSPACE/.build-cache/sccache"
          tool="$GITHUB_WORKSPACE/.build-cache/tool-bin/sccache"
          if [[ -x "$tool" ]]; then
            "$tool" --stop-server || true
          elif [[ -x "${tool}.exe" ]]; then
            "${tool}.exe" --stop-server || true
          fi

      - name: Save Qt cache (macOS)
        if: matrix.id == 'macos-arm64' && steps.qt-cache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-cache/qt-macos-arm64.tar.zst
          key: qt-macos-arm64-${{ hashFiles('scripts/qt/macos-arm64.stamp') }}

      - name: Save Qt cache (Windows)
        if: matrix.id == 'windows-x64' && steps.qt-cache-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-cache/qt-windows-x64.tar.zst
          key: qt-windows-x64-${{ hashFiles('scripts/qt/windows-x64.stamp') }}

      - name: Save sccache
        uses: actions/cache/save@v4
        with:
          path: .build-cache/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from Info.lua
        id: ver
        run: bash scripts/parse_plugin_version.sh --github-output

      - name: Validate changelog section for release tag
        run: bash scripts/build_release_notes.sh --check-only

      - name: Build release notes from CHANGELOG.md
        run: bash scripts/build_release_notes.sh

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.codename }} · v${{ steps.ver.outputs.semver }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/ExportHDR.lrplugin-macos-arm64.zip
            release-assets/ExportHDR.lrplugin-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
