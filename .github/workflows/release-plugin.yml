name: Release Lightroom plugin (macOS + Windows)

on:
  workflow_dispatch:

concurrency:
  group: release-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-26
            artifact: ExportHDR.lrplugin-macos-arm64.zip
          - id: windows-x64
            runner: windows-latest
            artifact: ExportHDR.lrplugin-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (macOS)
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: bash scripts/build_plugin.sh install-deps

      - name: Cache static Qt (macOS)
        if: matrix.id == 'macos-arm64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/Qt/6.11.2-static
          key: qt-6.11.2-macos-arm64-static-v1-${{ hashFiles('scripts/setup_qt_static.sh') }}

      - name: Build static Qt (macOS)
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: |
          export QT_STATIC_ROOT="$HOME/Qt/6.11.2-static"
          bash scripts/setup_qt_static.sh
          echo "QT_STATIC_ROOT=$QT_STATIC_ROOT" >> "$GITHUB_ENV"

      - name: Setup CMake 3.31 (Windows)
        if: matrix.id == 'windows-x64'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: latest

      - name: Setup MSVC (Windows)
        if: matrix.id == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Qt (Windows)
        if: matrix.id == 'windows-x64'
        uses: actions/cache@v4
        with:
          path: C:/Qt/6.11.2
          key: qt-6.11.2-windows-msvc2022-v3-${{ hashFiles('.github/workflows/release-plugin.yml') }}
          restore-keys: |
            qt-6.11.2-windows-msvc2022-v3-

      - name: Install Qt 6.11 (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $qtRoot = "C:\Qt"
          $prefix = Join-Path $qtRoot "6.11.2\msvc2022_64"
          $marker = Join-Path $prefix "lib\cmake\Qt6\Qt6Config.cmake"
          $shaderTools = Join-Path $prefix "lib\cmake\Qt6ShaderTools\Qt6ShaderToolsConfig.cmake"
          if (-not (Test-Path -LiteralPath $marker) -or -not (Test-Path -LiteralPath $shaderTools)) {
            if (Test-Path -LiteralPath (Join-Path $qtRoot "6.11.2")) {
              Write-Host "Removing incomplete Qt install at $(Join-Path $qtRoot '6.11.2')"
              Remove-Item -LiteralPath (Join-Path $qtRoot "6.11.2") -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $qtRoot | Out-Null
            python -m pip install --upgrade pip "git+https://github.com/miurahr/aqtinstall.git"
            python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 `
              --outputdir $qtRoot `
              --external 7z
            python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 `
              -m qtshadertools `
              --outputdir $qtRoot `
              --external 7z
          } else {
            Write-Host "Qt already present at $prefix"
          }
          "QT_ROOT_DIR=$prefix" >> $env:GITHUB_ENV

      - name: Install WebView2 SDK (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $sdkRoot = "C:\WebView2Sdk"
          $marker = Join-Path $sdkRoot "include\WebView2.h"
          if (-not (Test-Path -LiteralPath $marker)) {
            $pkgRoot = Join-Path $env:RUNNER_TEMP "webview2-nuget"
            $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
            if (-not (Test-Path -LiteralPath $nuget)) {
              Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
            }
            if (Test-Path -LiteralPath $pkgRoot) {
              Remove-Item -LiteralPath $pkgRoot -Recurse -Force
            }
            & $nuget install Microsoft.Web.WebView2 -OutputDirectory $pkgRoot -ExcludeVersion
            $pkg = Join-Path $pkgRoot "Microsoft.Web.WebView2"
            New-Item -ItemType Directory -Force -Path (Join-Path $sdkRoot "include"), (Join-Path $sdkRoot "lib\x64") | Out-Null
            Copy-Item -Path (Join-Path $pkg "build\native\include\*") -Destination (Join-Path $sdkRoot "include") -Recurse -Force
            Copy-Item -Path (Join-Path $pkg "build\native\x64\WebView2LoaderStatic.lib") -Destination (Join-Path $sdkRoot "lib\x64") -Force
          }
          "WEBVIEW2_SDK=$sdkRoot" >> $env:GITHUB_ENV

      - name: Build, test, and package plugin
        shell: bash
        run: |
          if [[ "${{ matrix.id }}" == "macos-arm64" ]]; then
            # Static Qt is the script default. The cache step already installed it.
            export QT_STATIC_ROOT="${QT_STATIC_ROOT:-$HOME/Qt/6.11.2-static}"
          else
            export UHDR_STATIC_QT=OFF
            if [[ -n "${QT_ROOT_DIR:-}" ]]; then
              if command -v cygpath &>/dev/null; then
                export CMAKE_PREFIX_PATH="$(cygpath -u "$QT_ROOT_DIR")"
                export PATH="$(cygpath -u "$QT_ROOT_DIR/bin"):$PATH"
              else
                export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
                export PATH="$QT_ROOT_DIR/bin:$PATH"
              fi
            fi
          fi
          bash scripts/build_plugin.sh all

      - name: macOS shell quoting regression test
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: bash scripts/test_macos_shell_quote.sh

      - name: Windows cmd quoting regression test
        if: matrix.id == 'windows-x64'
        shell: powershell
        run: .\scripts\test_windows_cmd_quote.ps1

      - name: HDR chart encode snapshot
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: bash scripts/check_hdr_chart_snapshot.sh

      - name: HDR chart encode snapshot
        if: matrix.id == 'windows-x64'
        shell: powershell
        run: .\scripts\check_hdr_chart_snapshot.ps1

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from Info.lua
        id: ver
        run: bash scripts/parse_plugin_version.sh --github-output

      - name: Validate changelog section for release tag
        run: bash scripts/build_release_notes.sh --check-only

      - name: Build release notes from CHANGELOG.md
        run: bash scripts/build_release_notes.sh

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.codename }} · v${{ steps.ver.outputs.semver }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/ExportHDR.lrplugin-macos-arm64.zip
            release-assets/ExportHDR.lrplugin-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
