name: Release Lightroom plugin (macOS + Windows)

on:
  workflow_dispatch:

concurrency:
  group: release-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-26
            artifact: ExportHDR.lrplugin-macos-arm64.zip
          - id: windows-x64
            runner: windows-latest
            artifact: ExportHDR.lrplugin-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (macOS)
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: bash scripts/build_plugin.sh install-deps

      - name: Setup CMake 3.31 (Windows)
        if: matrix.id == 'windows-x64'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: latest

      - name: Setup MSVC (Windows)
        if: matrix.id == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache static Qt (macOS)
        if: matrix.id == 'macos-arm64'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uhdr-qt-static
            ~/Qt/6.11.0-static
          key: qt-static-6.11.0-macos-arm64-${{ hashFiles('scripts/setup_qt_static.sh') }}
          restore-keys: |
            qt-static-6.11.0-macos-arm64-

      - name: Build static Qt (macOS)
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: |
          if [[ ! -f "${HOME}/Qt/6.11.0-static/lib/cmake/Qt6/Qt6Config.cmake" ]]; then
            bash scripts/setup_qt_static.sh
          else
            echo "Static Qt already present at ${HOME}/Qt/6.11.0-static"
          fi

      - name: Install Qt 6.11 (Windows)
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip "aqtinstall==3.3.0"
          $qtRoot = Join-Path $env:USERPROFILE "Qt"
          python -m aqt install-qt windows desktop 6.11.0 win64_msvc2022_64 `
            -m qtshadertools `
            --outputdir $qtRoot `
            --base https://download.qt.io/online/qtsdkrepository
          "QT_ROOT_DIR=$qtRoot/6.11.0/msvc2022_64" >> $env:GITHUB_ENV

      - name: Build, test, and package plugin
        shell: bash
        env:
          UHDR_STATIC_QT: ${{ matrix.id == 'macos-arm64' && 'ON' || 'OFF' }}
        run: |
          if [[ "${{ matrix.id }}" == "macos-arm64" ]]; then
            export QT_STATIC_ROOT="${HOME}/Qt/6.11.0-static"
            if [[ ! -f "${QT_STATIC_ROOT}/lib/cmake/Qt6/Qt6Config.cmake" ]]; then
              echo "Static Qt missing at ${QT_STATIC_ROOT}" >&2
              exit 1
            fi
          elif [[ -n "${QT_ROOT_DIR:-}" ]]; then
            export CMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          fi
          bash scripts/build_plugin.sh all

      - name: macOS shell quoting regression test
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: bash scripts/test_macos_shell_quote.sh

      - name: Windows cmd quoting regression test
        if: matrix.id == 'windows-x64'
        shell: powershell
        run: .\scripts\test_windows_cmd_quote.ps1

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from Info.lua
        id: ver
        run: bash scripts/parse_plugin_version.sh --github-output

      - name: Validate changelog section for release tag
        run: bash scripts/build_release_notes.sh --check-only

      - name: Build release notes from CHANGELOG.md
        run: bash scripts/build_release_notes.sh

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.codename }} · v${{ steps.ver.outputs.semver }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/ExportHDR.lrplugin-macos-arm64.zip
            release-assets/ExportHDR.lrplugin-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
